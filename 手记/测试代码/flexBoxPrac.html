<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"> -->
    <title>弹性盒子练习</title>
    <!-- <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <link rel="stylesheet" href=""> -->

    <style>
        * {
            font-family: Arial;
            font-size: 15px;
            margin: 0px;
            padding: 0px;
            border: none;
        }

        ul { list-style: none;}

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            /* background-color: rgba(126, 116, 116, 0.7); */
            /* background-image: url("../img/img01.png"); */
            background-image: linear-gradient(30deg,blue,purple,grey);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .page-header {
            height: 80px;
            background-color: rgba(16, 16, 16, 0.7);
            padding-left: 20px;
            line-height: 80px;
            display: flex;
            justify-content: space-between; /* ！利用该属性把项目分成左右两部分靠边 */
        }
        .header-icon {
            color: rgba(256,256,256,0.8);
            font-family: STKaiti;
            font-size: 50px;
            vertical-align: middle;
            text-decoration: none;
        }
        .header-nav {
            font-size: 40px;
            font-family: Microsoft YaHei;
            display: flex;
        }
        .header-nav li a {
            color: white;
            background-color: rgba(64,64,64,0.75);
            text-decoration: none;
            font-size: 40px;
            font-weight: bold;
            border: 1px;
            border-color: white;
            border-radius: 8px;
            padding: 10px;
            margin: 0px 10px;
        }

        .content {
            display: flex;
            height: calc(100% - 80px);
            /* background: #000; */
            align-items: center;
        }
        .content-nav {
            width: 1000px;
            height: 400px;
            background: skyblue;
            margin: 0 auto;
            
        }
        .content-nav ul {
            display: flex;
            justify-content: space-evenly;
        }
        .content-nav ul li {
            width: 180px;
            height: 300px;
            text-align: center;
            margin-top: 50px;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <!--[if lt IE 7]>
        <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
    <![endif]-->
    <header class="page-header">
        <a href="http://www.atguigu.com/", class="header-icon">尚硅谷</a>
        <ul class="header-nav">    <!-- 利用列表把这几项集合起来而不是每个搞一个div出来 */ -->
            <li><a href="#">国内校区</a></li>
            <li><a href="#">东南亚校区</a></li>
            <li><a href="#">欧洲校区</a></li>
            <li><a href="#">北美校区</a></li>
        </ul>
        <!-- <a href="#">
            <img src="example.jpg" alt="示例图片">
        </a> -->
        <!-- <div class="header-menu", id="menu01">国内校区</div>
        <div class="header-menu", id="menu02">东南亚校区</div>
        <div class="header-menu", id="menu03">欧洲校区</div>
        <div class="header-menu", id="menu04">北美校区</div> -->
        
    </header>
    <div class="content">
        <div class="content-nav">
            <ul>
                <li style="background-color:#595CA8;">####</li>
                <li style="background-color:#FF9D2E;">@@@@</li>
                <li style="background-color:#01A6DE;">****</li>
                <li style="background-color:#015E91;">%%%%</li>
                <li style="background-color:#1DC128;">￥￥￥￥</li>
            </ul>
        </div>
    </div>
    <script>
        /* bug待解决
            1. background-image无法显示
        */
    </script>
</body>
</html>

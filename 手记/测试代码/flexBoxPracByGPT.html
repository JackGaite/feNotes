<head>
    <meta charset="utf-8">

    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
    <style>
        /* 设置header元素A */
        header {
            display: flex;
            justify-content: center;
            height: auto;
            /* 动态高度，适应内容 */
            height: 100px;
            /* 最小高度为100px */
            background-color: orange;
            padding: 10px 0;
            /* 额外内边距，避免挤压 */
        }

        /* 设置子元素B (ul) */
        header ul {
            display: flex;
            flex-wrap: wrap;
            /* 允许换行 */
            list-style-type: none;
            padding: 0;
            margin: 0;
            width: 100%;
            justify-content: space-between;
        }

        /* 设置li子元素 */
        header ul li {
            flex-basis: 23%;
            /* 每个li占23%的宽度，确保四个一行 */
            margin-bottom: 10px;
            /* 增加行间距 */
        }

        /* 设置超链接样式 */
        header ul li a {
            text-decoration: none;
            color: #333;
            font-size: 50px;
        }

        header ul li a:hover {
            color: #007BFF;
        }
    </style>
</head>

<body>
